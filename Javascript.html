<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>First App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4ff;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        div {
            background-color: white;
            padding: 50px;
            width: 500px;
            text-align: center;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #222;
            font-size: 30px;
            margin-bottom: 30px;
        }

        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #1d4ed8;
        }
    </style>
  </head>
  <body>
    <div>
      <h1 id="title">This is my first JavaScript Code</h1>
      <button id="button">Click</button>
    </div>

    <script>
      let title = document.getElementById("title");
      title.innerHTML = "This will not be my last";
      console.log(title);
      let button = document.getElessmentById("button");
      button.textContent = "Submit";
    </script>
  </body>
</html>
